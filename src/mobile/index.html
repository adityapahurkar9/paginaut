<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Paginaut</title>
    <link rel="stylesheet" href="reading.css" />
    <link rel="stylesheet" href="mobile.css" />
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        var t = JSON.parse(localStorage.getItem("paginaut.m.settings") || "{}").theme || "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
    <script>
      // A WebView too old to run the app (Android System WebView not updated): say so rather than stay blank.
      setTimeout(function () {
        var app = document.getElementById("app");
        if (app && !app.firstChild) {
          app.innerHTML =
            '<div style="padding:32px 24px;font:16px/1.5 sans-serif;color:#141a2e">' +
            "<h2>Paginaut needs a newer WebView</h2>" +
            "<p>Update <b>Android System WebView</b> (or Chrome) from the Play Store, then open Paginaut again.</p></div>";
        }
      }, 6000);
    </script>
  </body>
</html>
