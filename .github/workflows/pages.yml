# Publishes site/ (the website, https://adityapahurkar9.github.io/paginaut/) with GitHub Pages whenever it changes on
# main. Static files only: no build step, nothing from outside the repository.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages looks the uploaded site up among the run's artifacts.
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as GitHub's own example has it: deployed from the same job right after uploading, the site's artifact
# often wasn't listed yet ("No artifacts named github-pages"), and only a rerun went through.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
