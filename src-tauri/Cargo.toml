[package]
name = "paginaut"
version = "0.9.10"
description = "Fast PDF reader, annotator and toolkit"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.80"

[lib]
name = "paginaut_lib"
# cdylib: the Android app loads the library itself.
crate-type = ["rlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
once_cell = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Compare: lining two documents' words up.
similar = { version = "3", default-features = false, features = ["std"] }
minisign-verify = "0.3"
# Links in documents open in the browser (Windows and Android).
tauri-plugin-opener = "2"

# Desktop only: the Android viewer gets files from Android itself.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

# Android: the engine's process gets documents as file handles over a socket (engine_link.rs).
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Downloads (OCR models, voices, updates) and their checks: Windows does these itself (net.rs).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
sha1 = "0.11"
sha2 = "0.11"
# Saved signatures: sealed under a key in the desktop's keyring (Windows uses DPAPI; sigstore.rs).
# The desktop's keyring (Secret Service over D-Bus): keyring-core with its D-Bus store (keyring 4's split; it finds
# the items keyring 3 made, by service and user name).
keyring-core = "1"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
# Printing: GTK's print dialog and print jobs (the version Tauri itself uses on Linux; print_linux.rs).
gtk = "0.18"
# Signing with certificates: the system's OpenSSL (Windows uses its own crypto; dsc.rs).
openssl = "0.10"
openssl-sys = "0.9"
foreign-types = "0.3"
# DSC tokens and smart cards through their PKCS#11 drivers (pkcs11.rs).
cryptoki = "0.12"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri uses, to reach WebView2 settings it doesn't expose (touchpad pinch).
webview2-com = "0.39"
windows-core = "0.62"
# DPAPI: saved signatures are encrypted for the Windows user. WinHTTP and BCrypt:
# downloading OCR language models and checking them.
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Networking_WinHttp",
  # Office conversion: Word/Excel/PowerPoint through COM, LibreOffice run in a job object, its installer's
  # signature checked, installed copies found in the registry.
  "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_JobObjects",
  "Win32_System_Threading", "Win32_Security_WinTrust", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
  "Win32_Storage_FileSystem",
  # The status bar's memory figure: the app's own processes asked directly.
  "Win32_System_ProcessStatus",
  # Default app: file types offered in Windows (Open with, Default apps) and who opens them now.
  "Win32_UI_Shell",
  # Compare: Excel's short date follows Windows' own.
  "Win32_Globalization",
  # Snap Layouts on our own maximize button (snap.rs).
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader",
  # The tab being dragged, shown under the mouse outside the window (dragghost.rs).
  "Win32_UI_HiDpi",
  # Printing: Windows' print dialog and GDI.
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_Storage_Xps",
  # Read aloud: the voices installed in Windows.
  "Foundation", "Foundation_Collections", "Media_Core", "Media_SpeechSynthesis", "Storage_Streams",
] }

[profile.dev]
# MuPDF is always an optimised static library; keep our own code quick too.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
