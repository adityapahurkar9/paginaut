[package]
name = "paginaut"
version = "0.6.30"
description = "Fast PDF reader, annotator and toolkit"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.80"

[lib]
name = "paginaut_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
once_cell = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri uses, to reach WebView2 settings it doesn't expose (touchpad pinch).
webview2-com = "0.39"
windows-core = "0.62"
# DPAPI: saved signatures are encrypted for the Windows user. WinHTTP and BCrypt:
# downloading OCR language models and checking them.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Networking_WinHttp"] }

[profile.dev]
# MuPDF is always an optimised static library; keep our own code quick too.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
